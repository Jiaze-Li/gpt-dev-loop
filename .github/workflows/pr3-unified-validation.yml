name: PR3 unified frontend validation

on:
  push:
    branches:
      - phase1-handshake

permissions:
  contents: read

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.tests.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: tests
        shell: bash
        run: |
          node -e "const fs=require('fs'); const files=fs.readdirSync('tests').filter(f=>f.endsWith('.test.js')).sort().map(f=>'tests/'+f); console.log('files='+JSON.stringify(files))" >> "$GITHUB_OUTPUT"

  test-file:
    needs: discover-tests
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover-tests.outputs.files) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.file }}
        run: node --test "${{ matrix.file }}"

  validate:
    needs: test-file
    if: ${{ always() && needs.test-file.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run benchmark
      - run: git diff --check origin/main...HEAD
