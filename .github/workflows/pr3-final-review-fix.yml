name: PR3 final review fix

on:
  push:
    branches:
      - phase1-handshake

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: ${{ !contains(github.event.head_commit.message, 'fix: address final PR3 review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply bounded review fixes and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # P1: CLI wait without --status must wait for a terminal state.
          replace_once(
              'bin/supergpt.js',
              "      predicate: (s) => (opts.targetStatus ? s.workflowStatus === opts.targetStatus : true),",
              "      predicate: (s) => (opts.targetStatus ? s.workflowStatus === opts.targetStatus : ['DONE', 'HUMAN_REQUIRED', 'FAILED', 'TIMEOUT', 'STALLED', 'STOPPED'].includes(s.workflowStatus)),",
          )

          # P2: ownership checks must accept any centrally validated workflow ID
          # when the lifecycle manager knows the exact workflow ID.
          replace_once(
              'src/orchestrator/workflowLifecycle.js',
              '''export function isSuperGptOwnedWorktree(targetPath, root = SUPERGPT_WORKTREE_ROOT) {
            if (typeof targetPath !== 'string' || !targetPath) return false;
            const resolvedTarget = path.resolve(targetPath);
            const resolvedRoot = path.resolve(root);

            // Must be strictly inside the SuperGPT worktrees root
            if (!resolvedTarget.startsWith(resolvedRoot) || resolvedTarget === resolvedRoot) {
              return false;
            }

            // Must follow SuperGPT naming convention containing -wf-agy- or -wf-
            const basename = path.basename(resolvedTarget);
            return /-wf-(agy-)?[0-9a-fA-F-]+/.test(basename);
          }''',
              '''export function isSuperGptOwnedWorktree(targetPath, root = SUPERGPT_WORKTREE_ROOT, workflowId = null) {
            if (typeof targetPath !== 'string' || !targetPath) return false;
            const resolvedTarget = path.resolve(targetPath);
            const resolvedRoot = path.resolve(root);

            // Must be strictly inside the SuperGPT worktrees root. Use
            // path.relative rather than a raw string prefix so sibling paths such
            // as /worktrees-other can never be mistaken for owned resources.
            const relative = path.relative(resolvedRoot, resolvedTarget);
            if (!relative || relative === '..' || relative.startsWith(`..${path.sep}`) || path.isAbsolute(relative)) {
              return false;
            }

            const basename = path.basename(resolvedTarget);

            // When the owning workflow is known, use the same central workflow-ID
            // grammar as createWorkflowWorktree() and require the exact suffix it
            // constructs: <repo-basename>-<workflowId>. This supports valid
            // hand-authored IDs without weakening generic GC detection.
            if (workflowId !== null && workflowId !== undefined) {
              try {
                validateWorkflowId(workflowId);
              } catch {
                return false;
              }
              return basename.length > workflowId.length + 1 && basename.endsWith(`-${workflowId}`);
            }

            // Generic discovery remains conservative for legacy/default generated
            // names when no authoritative workflow ID is available.
            return /-wf-(agy-)?[0-9a-fA-F-]+/.test(basename);
          }''',
          )

          p = Path('src/orchestrator/workflowLifecycle.js')
          text = p.read_text()
          old = 'if (!isSuperGptOwnedWorktree(worktreePath, this.root)) {'
          if text.count(old) != 2:
              raise SystemExit(f'workflowLifecycle.js: expected two manager ownership checks, found {text.count(old)}')
          text = text.replace(old, 'if (!isSuperGptOwnedWorktree(worktreePath, this.root, this.workflowId)) {')
          p.write_text(text)

          # P2: installer updates are transactional. Snapshot every frontend file
          # the install can mutate, including the Claude/Codex MCP config files,
          # then restore exact prior bytes if any registration or later write fails.
          replace_once(
              'bin/install-plugin.js',
              '''function renderAgySkill(commonPolicy) {
            return `---\\nname: supergpt\\ndescription: Shared SuperGPT frontend launcher contract.\\n---\\n\\n${String(commonPolicy).trim()}\\n`;
          }

          async function readAgyConfig(mcpConfigFile) {''',
              '''function renderAgySkill(commonPolicy) {
            return `---\\nname: supergpt\\ndescription: Shared SuperGPT frontend launcher contract.\\n---\\n\\n${String(commonPolicy).trim()}\\n`;
          }

          async function snapshotFileState(filePath) {
            try {
              return { existed: true, content: await readFile(filePath) };
            } catch (err) {
              if (err?.code === 'ENOENT') return { existed: false, content: null };
              throw err;
            }
          }

          async function restoreFileState(filePath, snapshot) {
            // Remove any partial replacement first, including an unexpected
            // directory/symlink at a path that used to be absent or a file.
            await rm(filePath, { recursive: true, force: true });
            if (!snapshot?.existed) return;
            await mkdir(path.dirname(filePath), { recursive: true });
            await writeFile(filePath, snapshot.content);
          }

          async function restoreFileStates(snapshots) {
            const errors = [];
            for (const [filePath, snapshot] of snapshots) {
              try {
                await restoreFileState(filePath, snapshot);
              } catch (err) {
                errors.push(`${filePath}: ${err?.message || err}`);
              }
            }
            return errors;
          }

          async function readAgyConfig(mcpConfigFile) {''',
          )

          replace_once(
              'bin/install-plugin.js',
              '''  let claudeRegistered = false;
            let codexRegistered = false;
            try {
              registerClaudeMcp(execFileSync, nodeBin, mcpBin);
              claudeRegistered = true;
              registerCodexMcp(execFileSync, nodeBin, mcpBin);
              codexRegistered = true;

              await mkdir(agyConfigDir, { recursive: true });
              await mkdir(agySkillTargetDir, { recursive: true });

              agyConfig.mcpServers[MCP_NAME] = { command: nodeBin, args: [mcpBin] };
              await writeFile(mcpConfigFile, `${JSON.stringify(agyConfig, null, 2)}\\n`, 'utf8');
              await writeFile(agyPolicyFile, renderAgySkill(commonPolicy), 'utf8');

              await upsertManagedPolicy(claudePolicyFile, commonPolicy);
              await upsertManagedPolicy(codexPolicyFile, commonPolicy);
            } catch (err) {
              if (codexRegistered) removeCodexMcp(execFileSync);
              if (claudeRegistered) removeClaudeMcp(execFileSync);
              throw err;
            }''',
              '''  const claudeMcpConfigFile = path.join(homeDir, '.claude.json');
            const codexMcpConfigFile = path.join(homeDir, '.codex', 'config.toml');
            const transactionalPaths = [
              mcpConfigFile,
              agyPolicyFile,
              claudePolicyFile,
              codexPolicyFile,
              claudeMcpConfigFile,
              codexMcpConfigFile,
            ];
            const snapshots = new Map();
            for (const filePath of transactionalPaths) {
              snapshots.set(filePath, await snapshotFileState(filePath));
            }

            // Validate existing managed policy blocks before the first MCP
            // registration mutates frontend state.
            for (const policyPath of [claudePolicyFile, codexPolicyFile]) {
              const snapshot = snapshots.get(policyPath);
              if (snapshot?.existed) stripManagedPolicy(snapshot.content.toString('utf8'));
            }

            try {
              registerClaudeMcp(execFileSync, nodeBin, mcpBin);
              registerCodexMcp(execFileSync, nodeBin, mcpBin);

              await mkdir(agyConfigDir, { recursive: true });
              await mkdir(agySkillTargetDir, { recursive: true });

              agyConfig.mcpServers[MCP_NAME] = { command: nodeBin, args: [mcpBin] };
              await writeFile(mcpConfigFile, `${JSON.stringify(agyConfig, null, 2)}\\n`, 'utf8');
              await writeFile(agyPolicyFile, renderAgySkill(commonPolicy), 'utf8');

              await upsertManagedPolicy(claudePolicyFile, commonPolicy);
              await upsertManagedPolicy(codexPolicyFile, commonPolicy);
            } catch (err) {
              // Registration helpers remove/replace existing entries. Remove any
              // partial new entry, then restore the exact pre-install config and
              // policy bytes for every frontend.
              removeCodexMcp(execFileSync);
              removeClaudeMcp(execFileSync);
              const rollbackErrors = await restoreFileStates(snapshots);
              if (rollbackErrors.length > 0) {
                err.rollbackErrors = rollbackErrors;
                err.message = `${err.message} (rollback incomplete: ${rollbackErrors.join('; ')})`;
              }
              throw err;
            }''',
          )

          Path('tests/pr3FinalReviewRegression.test.js').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { fileURLToPath } from 'node:url';
          import { mkdtemp, mkdir, writeFile, readFile, rm } from 'node:fs/promises';
          import { existsSync, mkdirSync, writeFileSync } from 'node:fs';

          import { WorkflowStateManager } from '../src/orchestrator/workflowState.js';
          import { WorkflowLifecycleManager, isSuperGptOwnedWorktree } from '../src/orchestrator/workflowLifecycle.js';
          import { installGlobal } from '../bin/install-plugin.js';

          const repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const commonPolicy = path.join(repoRoot, 'agent-policy', 'COMMON.md');

          test('P1 final review: CLI wait without --status does not accept RUNNING and returns only after terminal', async () => {
            const home = await mkdtemp(path.join(os.tmpdir(), 'supergpt-cli-wait-final-'));
            const root = path.join(home, '.supergpt', 'worktrees');
            const workflowId = 'wf-cli-wait-final';
            await mkdir(root, { recursive: true });
            const manager = new WorkflowStateManager({ workflowId, root });
            manager.startStage('INIT');

            try {
              const bin = path.join(repoRoot, 'bin', 'supergpt.js');
              const env = { ...process.env, HOME: home };
              const running = spawnSync(process.execPath, [bin, 'wait', workflowId, '--timeout=120', '--output-format=json'], {
                cwd: repoRoot,
                env,
                encoding: 'utf8',
              });
              assert.notEqual(running.status, 0, 'default wait must not return success for RUNNING');

              manager.transitionTerminal('DONE', { summary: 'done' });
              const done = spawnSync(process.execPath, [bin, 'wait', workflowId, '--timeout=1000', '--output-format=json'], {
                cwd: repoRoot,
                env,
                encoding: 'utf8',
              });
              assert.equal(done.status, 0, done.stderr);
              assert.equal(JSON.parse(done.stdout).workflowStatus, 'DONE');
            } finally {
              await rm(home, { recursive: true, force: true });
            }
          });

          test('P2 final review: lifecycle accepts the exact worktree produced for any validated hand-authored workflow ID', async () => {
            const root = await mkdtemp(path.join(os.tmpdir(), 'supergpt-custom-id-final-'));
            const workflowId = 'my-workflow_123';
            const worktreePath = path.join(root, `repo-${workflowId}`);
            await mkdir(worktreePath, { recursive: true });
            try {
              assert.equal(isSuperGptOwnedWorktree(worktreePath, root, workflowId), true);
              assert.equal(isSuperGptOwnedWorktree(path.join(root, 'repo-other-id'), root, workflowId), false);
              const manager = new WorkflowLifecycleManager({ workflowId, root });
              assert.doesNotThrow(() => manager.trackWorktree(worktreePath));
              assert.equal(manager.resources.worktrees[0].path, worktreePath);
            } finally {
              await rm(root, { recursive: true, force: true });
            }
          });

          test('P2 final review: failed global update restores every prior frontend config/policy byte-for-byte', async () => {
            const home = await mkdtemp(path.join(os.tmpdir(), 'supergpt-install-rollback-final-'));
            const configDir = path.join(home, '.gemini', 'config');
            const mcpConfigFile = path.join(configDir, 'mcp_config.json');
            const agyPolicyFile = path.join(configDir, 'skills', 'supergpt', 'SKILL.md');
            const claudePolicyFile = path.join(home, '.claude', 'CLAUDE.md');
            const codexPolicyFile = path.join(home, '.codex', 'AGENTS.md');
            const claudeMcpConfigFile = path.join(home, '.claude.json');
            const codexMcpConfigFile = path.join(home, '.codex', 'config.toml');

            const old = {
              agyConfig: `${JSON.stringify({ mcpServers: { supergpt: { command: '/old/node', args: ['/old/mcp'] }, other: { command: 'keep' } } }, null, 2)}\n`,
              agyPolicy: 'old agy policy\n',
              claudePolicy: '# old Claude policy\n',
              claudeMcp: '{"mcpServers":{"supergpt":{"command":"/old/claude"}}}\n',
              codexMcp: '[mcp_servers.supergpt]\ncommand = "/old/codex"\n',
            };

            await mkdir(path.dirname(agyPolicyFile), { recursive: true });
            await mkdir(path.dirname(claudePolicyFile), { recursive: true });
            await mkdir(path.dirname(codexMcpConfigFile), { recursive: true });
            await writeFile(mcpConfigFile, old.agyConfig);
            await writeFile(agyPolicyFile, old.agyPolicy);
            await writeFile(claudePolicyFile, old.claudePolicy);
            await writeFile(claudeMcpConfigFile, old.claudeMcp);
            await writeFile(codexMcpConfigFile, old.codexMcp);

            const execFileSync = (command, args = []) => {
              if (args[0] === '--version') return `${command} test-version\n`;
              if ((command === 'claude' || command === 'codex') && args[0] === 'mcp') {
                const action = args[1];
                const configFile = command === 'claude' ? claudeMcpConfigFile : codexMcpConfigFile;
                if (action === 'remove') {
                  writeFileSync(configFile, `${command}-removed\n`);
                  return 'removed\n';
                }
                if (action === 'add') {
                  writeFileSync(configFile, `${command}-new\n`);
                  if (command === 'codex') {
                    // Make the final policy target unwritable as a file only
                    // after the installer has snapshotted the old state.
                    mkdirSync(codexPolicyFile, { recursive: true });
                  }
                  return 'added\n';
                }
                if (action === 'get') return 'configured\n';
              }
              throw new Error(`unexpected command: ${command} ${args.join(' ')}`);
            };

            try {
              await assert.rejects(() => installGlobal({
                configDir,
                homeDir: home,
                policyFile: commonPolicy,
                mcpBin: '/new/supergpt-mcp.js',
                nodeBin: '/new/node',
                execFileSync,
              }));

              assert.equal(await readFile(mcpConfigFile, 'utf8'), old.agyConfig);
              assert.equal(await readFile(agyPolicyFile, 'utf8'), old.agyPolicy);
              assert.equal(await readFile(claudePolicyFile, 'utf8'), old.claudePolicy);
              assert.equal(await readFile(claudeMcpConfigFile, 'utf8'), old.claudeMcp);
              assert.equal(await readFile(codexMcpConfigFile, 'utf8'), old.codexMcp);
              assert.equal(existsSync(codexPolicyFile), false);
            } finally {
              await rm(home, { recursive: true, force: true });
            }
          });
          '''.replace(/^          /gm, ''))
          PY

      - run: npm ci
      - name: Run focused final-review regressions
        run: node --test tests/pr3FinalReviewRegression.test.js tests/installPlugin.test.js tests/workflowLifecycle.test.js tests/supergptControlInterface.test.js
      - name: Run full suite
        run: npm test
      - name: Run deterministic benchmark
        run: npm run benchmark
      - name: Check diff whitespace
        run: git diff --check

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "Jiaze-Li"
          git config user.email "128044415+Jiaze-Li@users.noreply.github.com"
          git add bin/supergpt.js bin/install-plugin.js src/orchestrator/workflowLifecycle.js tests/pr3FinalReviewRegression.test.js
          git commit -m "fix: address final PR3 review"
          git push origin HEAD:phase1-handshake
