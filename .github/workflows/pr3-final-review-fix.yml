name: PR3 final review fix

on:
  push:
    branches:
      - phase1-handshake

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply bounded fixes
        run: python3 scripts/pr3-final-review-fix.py
      - run: npm ci
      - name: Focused regressions
        run: node --test tests/pr3FinalReviewRegression.test.js tests/installPlugin.test.js tests/workflowLifecycle.test.js tests/supergptControlInterface.test.js
      - name: Full suite
        run: npm test
      - name: Deterministic benchmark
        run: npm run benchmark
      - name: Diff check
        run: git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "Jiaze-Li"
          git config user.email "128044415+Jiaze-Li@users.noreply.github.com"
          git add bin/supergpt.js bin/install-plugin.js src/orchestrator/workflowLifecycle.js
          git commit -m "fix: address final PR3 review"
          git push origin HEAD:phase1-handshake
