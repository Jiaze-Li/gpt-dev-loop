name: PR3 diff-check diagnostic

on:
  push:
    branches:
      - phase1-handshake

permissions:
  contents: read

jobs:
  diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture diff-check output
        id: diffcheck
        shell: bash
        run: |
          set +e
          git diff --check origin/main...HEAD > diff-check.txt 2>&1
          status=$?
          cat diff-check.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: diff-check-output
          path: diff-check.txt
          if-no-files-found: error
      - name: Enforce diff-check
        shell: bash
        run: test "${{ steps.diffcheck.outputs.status }}" -eq 0
