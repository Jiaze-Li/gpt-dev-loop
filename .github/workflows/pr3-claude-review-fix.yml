name: PR3 Claude review fix

on:
  push:
    branches:
      - phase1-handshake

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply bounded fixes
        run: python3 scripts/pr3-claude-review-fix.py
      - run: npm ci
      - name: Focused regressions
        run: node --test tests/pr3ClaudeReviewRegression.test.js tests/workflowOwnershipConcurrency.test.js tests/preflight.test.js
      - name: Full suite
        run: npm test
      - name: Deterministic benchmark
        run: npm run benchmark
      - name: Diff check
        run: git diff --check
      - name: Commit validated fixes and remove temporary validation files
        shell: bash
        run: |
          git config user.name "Jiaze-Li"
          git config user.email "128044415+Jiaze-Li@users.noreply.github.com"
          git add src/orchestrator/preflight.js src/orchestrator/workflowOwnership.js src/orchestrator/supergpt.js
          git rm .github/workflows/pr3-claude-review-fix.yml scripts/pr3-claude-review-fix.py
          git commit -m "fix: address remaining Claude PR3 review"
          git push origin HEAD:phase1-handshake
